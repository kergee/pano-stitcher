<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>全景拼接 · Pano</title>
<style>
  :root {
    --bg: #0f1218; --panel: #181d26; --panel2: #1f2532; --line: #2b3345;
    --text: #e8ecf3; --dim: #8b96ab; --accent: #4f8cff; --ok: #3ecf8e; --err: #ff6b6b;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.6 "Segoe UI", system-ui, sans-serif; min-height: 100vh; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 32px 20px 80px; }
  h1 { font-size: 22px; font-weight: 650; }
  h1 span { color: var(--accent); }
  .sub { color: var(--dim); font-size: 13px; margin: 4px 0 24px; }

  #drop { border: 2px dashed var(--line); border-radius: 14px; background: var(--panel);
    padding: 36px; text-align: center; cursor: pointer; transition: .15s; }
  #drop.hover { border-color: var(--accent); background: var(--panel2); }
  #drop b { color: var(--accent); }
  #drop .hint { color: var(--dim); font-size: 13px; margin-top: 6px; }

  #thumbs { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  .thumb { position: relative; width: 118px; height: 88px; border-radius: 8px; overflow: hidden;
    border: 1px solid var(--line); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .thumb .x { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; border: 0;
    border-radius: 50%; background: rgba(0,0,0,.65); color: #fff; cursor: pointer; font-size: 12px; }
  .thumb .n { position: absolute; left: 4px; bottom: 4px; background: rgba(0,0,0,.6);
    font-size: 11px; padding: 0 6px; border-radius: 4px; }

  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 18px; margin: 22px 0;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 20px; }
  .grp { display: flex; align-items: center; gap: 10px; }
  .grp .lbl { color: var(--dim); font-size: 13px; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  .seg button { border: 0; background: transparent; color: var(--dim); padding: 8px 16px;
    cursor: pointer; font-size: 14px; }
  .seg button.on { background: var(--accent); color: #fff; }
  select { background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 10px; font-size: 14px; }
  input[type=number] { width: 92px; background: var(--panel2); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 10px; font-size: 14px; }
  input[type=range] { width: 104px; accent-color: var(--accent); }
  .qv { min-width: 24px; color: var(--dim); font-size: 13px; }
  #go { margin-left: auto; border: 0; border-radius: 10px; background: var(--accent); color: #fff;
    padding: 11px 30px; font-size: 15px; font-weight: 600; cursor: pointer; }
  #go:disabled { opacity: .45; cursor: not-allowed; }

  #status { display: none; align-items: center; gap: 12px; margin: 18px 0; color: var(--dim); }
  .spin { width: 18px; height: 18px; border: 3px solid var(--line); border-top-color: var(--accent);
    border-radius: 50%; animation: r 1s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }

  #results { display: grid; gap: 22px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .card .head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 12px 18px; }
  .card .head .tag { font-weight: 650; }
  .card .head .meta { color: var(--dim); font-size: 13px; }
  .card .head .cropsize { color: var(--ok); font-size: 13px; margin-left: auto; }
  .card .head button { border: 1px solid var(--line); border-radius: 8px; background: var(--panel2);
    color: var(--text); padding: 6px 14px; font-size: 13px; cursor: pointer; }
  .card .head button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .card.err .body { padding: 16px 18px; color: var(--err); }

  /* ---- 裁剪编辑器 ---- */
  .cropwrap { position: relative; overflow: hidden; background: #000; user-select: none; }
  .cropwrap img { display: block; width: 100%; pointer-events: none; }
  .cropRect { position: absolute; border: 1.5px solid rgba(255,255,255,.95);
    box-shadow: 0 0 0 100000px rgba(0,0,0,.55); cursor: move; touch-action: none; }
  .hh { position: absolute; touch-action: none; }
  .hn { top: -8px; left: 16px; right: 16px; height: 16px; cursor: ns-resize; }
  .hs { bottom: -8px; left: 16px; right: 16px; height: 16px; cursor: ns-resize; }
  .hw { left: -8px; top: 16px; bottom: 16px; width: 16px; cursor: ew-resize; }
  .he { right: -8px; top: 16px; bottom: 16px; width: 16px; cursor: ew-resize; }
  .hn::after, .hs::after { content: ""; position: absolute; left: 50%; top: 50%;
    transform: translate(-50%,-50%); width: 34px; height: 5px; border-radius: 3px; background: #fff; }
  .hw::after, .he::after { content: ""; position: absolute; left: 50%; top: 50%;
    transform: translate(-50%,-50%); width: 5px; height: 34px; border-radius: 3px; background: #fff; }
  .hnw { top: -10px; left: -10px; width: 20px; height: 20px; cursor: nwse-resize; }
  .hne { top: -10px; right: -10px; width: 20px; height: 20px; cursor: nesw-resize; }
  .hsw { bottom: -10px; left: -10px; width: 20px; height: 20px; cursor: nesw-resize; }
  .hse { bottom: -10px; right: -10px; width: 20px; height: 20px; cursor: nwse-resize; }
  .hnw::after, .hne::after, .hsw::after, .hse::after { content: ""; position: absolute;
    left: 50%; top: 50%; transform: translate(-50%,-50%); width: 11px; height: 11px;
    border-radius: 3px; background: #fff; }
</style>
</head>
<body>
<div class="wrap">
  <h1>全景拼接 <span>Pano</span></h1>
  <div class="sub">参考与借鉴 AutoStitch 相关论文和调研；OpenCV 基线与自建流水线可对照，支持可选深度匹配、MAGSAC、局部形变、接缝搜索和曝光补偿</div>

  <div id="drop">
    <div><b>点击选择</b> 或拖拽多张重叠照片到这里</div>
    <div class="hint">按拍摄顺序不重要，算法自动识别排列；相邻照片需 30% 以上重叠</div>
    <input id="file" type="file" accept="image/*" multiple hidden>
  </div>
  <div id="thumbs"></div>

  <div class="controls">
    <div class="grp"><span class="lbl">引擎</span>
      <div class="seg" id="engineSeg">
        <button data-v="pro" class="on">自建引擎</button>
        <button data-v="baseline">基线</button>
        <button data-v="both">双引擎对比</button>
      </div>
    </div>
    <div class="grp"><span class="lbl">特征后端</span>
      <select id="backend">
        <option value="auto">自动（优先深度）</option>
        <option value="deep">深度 DISK+LightGlue</option>
        <option value="sift">经典 SIFT</option>
      </select>
    </div>
    <div class="grp"><span class="lbl">投影</span>
      <select id="projection" title="仅自建引擎引擎生效；基线固定球面投影">
        <option value="spherical">球面（默认）</option>
        <option value="plane">平面（直线不弯）</option>
        <option value="cylindrical">柱面（竖线不弯）</option>
        <option value="mercator">墨卡托</option>
      </select>
    </div>
    <div class="grp"><span class="lbl">最大输出边长</span>
      <input id="maxOutputSide" type="number" min="0" max="12000" step="256" value="0" title="0 表示不限制">
    </div>
    <div class="grp"><span class="lbl">JPEG</span>
      <input id="jpegQuality" type="range" min="60" max="98" value="92">
      <span class="qv" id="jpegQualityVal">92</span>
    </div>
    <button id="go" disabled>开始拼接</button>
  </div>

  <div id="status"><div class="spin"></div><span id="statusText"></span></div>
  <div id="results"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const API_BASE = location.protocol === "http:" || location.protocol === "https:" ? "" : "http://127.0.0.1:8000";
const api = path => API_BASE + path;
let files = [];
let engine = "pro";

const drop = $("#drop"), input = $("#file");
drop.onclick = () => input.click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add("hover"); };
drop.ondragleave = () => drop.classList.remove("hover");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("hover"); addFiles(e.dataTransfer.files); };
input.onchange = () => { addFiles(input.files); input.value = ""; };

function addFiles(list) {
  for (const f of list) if (f.type.startsWith("image/")) files.push(f);
  renderThumbs();
}
function renderThumbs() {
  const box = $("#thumbs"); box.innerHTML = "";
  files.forEach((f, i) => {
    const d = document.createElement("div"); d.className = "thumb";
    const img = document.createElement("img"); img.src = URL.createObjectURL(f);
    const x = document.createElement("button"); x.className = "x"; x.textContent = "✕";
    x.onclick = () => { files.splice(i, 1); renderThumbs(); };
    const n = document.createElement("span"); n.className = "n"; n.textContent = i + 1;
    d.append(img, x, n); box.append(d);
  });
  $("#go").disabled = files.length < 2;
}

$("#engineSeg").onclick = e => {
  if (e.target.dataset.v) {
    engine = e.target.dataset.v;
    document.querySelectorAll("#engineSeg button").forEach(b => b.classList.toggle("on", b === e.target));
    syncControls();
  }
};

const NAMES = { pro: "自建引擎", baseline: "OpenCV 基线" };

function syncControls() {
  const baselineOnly = engine === "baseline";
  $("#backend").disabled = baselineOnly;
  $("#projection").disabled = baselineOnly;
}
$("#jpegQuality").oninput = () => $("#jpegQualityVal").textContent = $("#jpegQuality").value;
syncControls();

async function stitchOne(eng) {
  const fd = new FormData();
  files.forEach(f => fd.append("files", f));
  fd.append("engine", eng);
  fd.append("backend", $("#backend").value);
  fd.append("projection", $("#projection").value);
  fd.append("max_output_side", $("#maxOutputSide").value);
  fd.append("jpeg_quality", $("#jpegQuality").value);
  const t0 = Date.now();
  try {
    const start = await fetch(api("/api/stitch/jobs"), { method: "POST", body: fd });
    const init = await start.json();
    if (!init.ok) return { ok: false, engine: eng, error: init.error || "任务创建失败" };

    return await new Promise(resolve => {
      let settled = false;
      let stage = "排队中";
      let frac = 0;
      const show = () => {
        const seconds = ((Date.now() - t0) / 1000).toFixed(0);
        const pct = Math.max(0, Math.min(100, Math.round(frac * 100)));
        $("#statusText").textContent = `${NAMES[eng]} ${stage} · ${pct}% · ${seconds} 秒`;
      };
      const timer = setInterval(show, 500);
      const es = new EventSource(api(`/api/stitch/jobs/${init.job_id}/events`));
      const finish = res => {
        if (settled) return;
        settled = true;
        clearInterval(timer);
        es.close();
        resolve(res);
      };
      es.addEventListener("progress", e => {
        const p = JSON.parse(e.data);
        stage = p.stage || stage;
        frac = Number.isFinite(p.frac) ? p.frac : frac;
        show();
      });
      es.addEventListener("done", async () => {
        try {
          const r = await fetch(api(`/api/stitch/jobs/${init.job_id}/result`));
          finish(await r.json());
        } catch (e) {
          finish({ ok: false, engine: eng, error: "读取结果失败：" + e });
        }
      });
      es.onerror = () => finish({ ok: false, engine: eng, error: "进度连接中断" });
      show();
    });
  } catch (e) {
    return { ok: false, engine: eng, error: "请求失败：" + e };
  }
}

/* ---- 裁剪编辑器：rect 存自然分辨率坐标，用百分比定位（窗口缩放自适应） ---- */
function makeCropEditor(card, res, eng) {
  const img = card.querySelector("img");
  const rEl = card.querySelector(".cropRect");
  const sizeEl = card.querySelector(".cropsize");
  const nw = res.width, nh = res.height;
  const MIN = Math.max(24, Math.round(Math.min(nw, nh) * 0.05));
  const auto = res.autocrop ? { ...res.autocrop } : { x: 0, y: 0, w: nw, h: nh };
  let rect = { ...auto };

  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  function render() {
    rEl.style.left = rect.x / nw * 100 + "%";
    rEl.style.top = rect.y / nh * 100 + "%";
    rEl.style.width = rect.w / nw * 100 + "%";
    rEl.style.height = rect.h / nh * 100 + "%";
    sizeEl.textContent = `裁剪 ${Math.round(rect.w)}×${Math.round(rect.h)}`;
  }

  function drag(el, dir) {
    el.onpointerdown = e => {
      e.preventDefault(); e.stopPropagation();
      el.setPointerCapture(e.pointerId);
      const k = nw / img.clientWidth;             // 显示像素 → 自然像素
      const s = { x: e.clientX, y: e.clientY, r: { ...rect } };
      el.onpointermove = ev => {
        const dx = (ev.clientX - s.x) * k, dy = (ev.clientY - s.y) * k;
        const r = { ...s.r };
        if (dir === "m") {
          r.x = clamp(s.r.x + dx, 0, nw - s.r.w);
          r.y = clamp(s.r.y + dy, 0, nh - s.r.h);
        } else {
          if (dir.includes("w")) { r.x = clamp(s.r.x + dx, 0, s.r.x + s.r.w - MIN); r.w = s.r.x + s.r.w - r.x; }
          if (dir.includes("e")) { r.w = clamp(s.r.w + dx, MIN, nw - s.r.x); }
          if (dir.includes("n")) { r.y = clamp(s.r.y + dy, 0, s.r.y + s.r.h - MIN); r.h = s.r.y + s.r.h - r.y; }
          if (dir.includes("s")) { r.h = clamp(s.r.h + dy, MIN, nh - s.r.y); }
        }
        rect = r; render();
      };
      el.onpointerup = el.onpointercancel = () => { el.onpointermove = null; };
    };
  }
  drag(rEl, "m");
  for (const d of ["n", "s", "e", "w", "nw", "ne", "sw", "se"])
    drag(card.querySelector(".h" + d), d);

  card.querySelector("[data-a=auto]").onclick = () => { rect = { ...auto }; render(); };
  card.querySelector("[data-a=full]").onclick = () => { rect = { x: 0, y: 0, w: nw, h: nh }; render(); };
  card.querySelector("[data-a=dl]").onclick = () => {
    const c = document.createElement("canvas");
    c.width = Math.round(rect.w); c.height = Math.round(rect.h);
    c.getContext("2d").drawImage(img, rect.x, rect.y, rect.w, rect.h, 0, 0, c.width, c.height);
    const a = document.createElement("a");
    a.download = `pano_${eng}.jpg`;
    a.href = c.toDataURL("image/jpeg", 0.92);
    a.click();
  };
  render();
}

function card(res, eng) {
  const c = document.createElement("div");
  if (!res.ok) {
    c.className = "card err";
    c.innerHTML = `<div class="head"><span class="tag">${NAMES[eng]}</span></div>
      <div class="body">${res.error || "未知错误"}</div>`;
    return c;
  }
  c.className = "card";
  const meta = [`${res.width}×${res.height}`, `${res.seconds} 秒`];
  if (res.backend) meta.push(`后端 ${res.backend}`);
  if (res.focal) meta.push(`焦距 ${res.focal}px`);
  if (res.dropped && res.dropped.length) meta.push(`丢弃 ${res.dropped.length} 张未连接图片`);
  c.innerHTML = `<div class="head">
      <span class="tag">${NAMES[eng]}</span>
      <span class="meta">${meta.join(" · ")}</span>
      <span class="cropsize"></span>
      <button data-a="auto">自动裁剪</button>
      <button data-a="full">全图</button>
      <button data-a="dl" class="primary">下载 JPEG</button>
    </div>
    <div class="cropwrap">
      <img src="${res.image}">
      <div class="cropRect">
        <div class="hh hn"></div><div class="hh hs"></div><div class="hh he"></div><div class="hh hw"></div>
        <div class="hh hnw"></div><div class="hh hne"></div><div class="hh hsw"></div><div class="hh hse"></div>
      </div>
    </div>`;
  makeCropEditor(c, res, eng);
  return c;
}

$("#go").onclick = async () => {
  $("#go").disabled = true;
  $("#results").innerHTML = "";
  $("#status").style.display = "flex";
  const engines = engine === "both" ? ["pro", "baseline"] : [engine];
  for (const eng of engines) {
    const res = await stitchOne(eng);
    $("#results").append(card(res, eng));
  }
  $("#status").style.display = "none";
  $("#go").disabled = files.length < 2;
};
</script>
</body>
</html>
