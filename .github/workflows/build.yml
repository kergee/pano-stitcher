name: Verify and build Windows

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8
  PANO_ALLOW_MODEL_DOWNLOAD: '0'

defaults:
  run:
    shell: pwsh

jobs:
  verify:
    name: Core and API (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime
        run: python -m pip install -r requirements.txt
      - name: Reliability counterexamples
        run: python -m unittest discover -s tests -v
      - name: Deterministic SIFT geometry regression
        run: python tools/benchmark.py --scenarios normal lowoverlap mixed --backends sift --bench-dir output/ci/bench --threads 2
      - name: Multipart API and SSE
        run: python tools/verify_web.py output/ci/bench/normal --report output/ci/web-verification.json
      - name: Record resolved dependencies
        if: always()
        run: |
          New-Item -ItemType Directory -Force output/ci | Out-Null
          python -m pip freeze | Set-Content -Encoding utf8 output/ci/dependencies.txt
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: verification-${{ matrix.os }}
          path: output/ci/
          retention-days: 14
          if-no-files-found: warn

  windows:
    name: Windows installers (SIFT)
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Package backend and Tauri installers
        run: ./tools/package_tauri.ps1
      - name: Smoke-test packaged backend
        run: |
          $backend = (Resolve-Path 'dist/pano-backend.exe').Path
          $process = Start-Process -FilePath $backend -ArgumentList '--port', '18765' -WindowStyle Hidden -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 90; $attempt++) {
              if ($process.HasExited) { throw 'Packaged backend exited before becoming ready.' }
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:18765/' -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'Packaged backend did not become ready.' }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
      - name: Upload installers
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Pano-Windows-x64-SIFT
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
